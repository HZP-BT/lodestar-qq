name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  minimum-node:
    # Pins the minimum supported line for node:sqlite (and the 22.x API
    # surface we rely on). The main matrix's 22.x job covers the latest 22.x.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  sqlite-probe:
    # Explicit runtime availability check: distro/third-party Node builds may
    # omit SQLite even when the Node version is supported.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.16.0, 24, 26]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: node -e "const s=require('node:sqlite'); const D=s.Database??s.DatabaseSync; const db=new D(':memory:'); db.exec('CREATE TABLE t(x)'); db.close(); console.log('node:sqlite ok', process.version, process.versions.modules)"
