name: Windows installer package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Build Windows installer package
        shell: pwsh
        run: |
          ./scripts/release/package-external.ps1 -OutputDir release-setup
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "lodestar-setup-$version-windows-x64.zip"
          Compress-Archive -Path release-setup/* -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path SHA256SUMS.txt -Value "$hash  $zip" -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lodestar-setup-windows
          path: |
            lodestar-setup-*.zip
            SHA256SUMS.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux tarball
        run: bash scripts/release/package-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lodestar-linux
          path: lodestar-*-linux-x64.tar.gz
          if-no-files-found: error
