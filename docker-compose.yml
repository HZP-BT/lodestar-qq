services:
  lodestar-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lodestar-core
    restart: unless-stopped
    ports:
      - '127.0.0.1:18080:18080'
      - '127.0.0.1:18081:18081'
      - '127.0.0.1:18090:18090'
    volumes:
      - ./data:/app/data
    environment:
      LODESTAR_SELF_ID: '10001'
      LODESTAR_ONEBOT_URL: 'ws://127.0.0.1:6199/ws'
      LODESTAR_DB_PATH: '/app/data/polaris.db'
      LODESTAR_STOP_FILE: '/app/data/STOP'
      LODESTAR_HEALTH_PORT: '18080'
      LODESTAR_CONTROL_PORT: '18090'
      LODESTAR_DATA_DIR: '/app/data'
      LODESTAR_ADMIN_HOST: '0.0.0.0'
      LODESTAR_ADMIN_PORT: '18081'
      LODESTAR_ADMIN_ALLOW_NON_LOOPBACK: '1'
      LODESTAR_NO_OPEN: '1'
      LODESTAR_SEND_GUARD_CONFIG: '/app/data/demo-send-guard.json'
      LODESTAR_PROTOCOL_CONFIG: '/app/data/demo-upstream.json'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:18080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
